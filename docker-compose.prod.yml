# Staging / EC2 stack (pull pre-built images from GHCR)
# Databases: Neon for tests now; RDS later (same env var names).
# On the server:
#   export IMAGE_TAG=<git-sha>
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

name: cognitif-connexion-foot

services:
  migrate:
    image: ghcr.io/${GHCR_OWNER:-imrane-ait-dahmade}/reflexion-foot-backend:${IMAGE_TAG:-master}
    environment:
      DATABASE_URL: ${BACKEND_DATABASE_URL}
      APP_ENV: ${APP_ENV:-staging}
      JWT_SECRET: ${JWT_SECRET}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    networks:
      - appnet

  backend:
    image: ghcr.io/${GHCR_OWNER:-imrane-ait-dahmade}/reflexion-foot-backend:${IMAGE_TAG:-master}
    environment:
      APP_NAME: ${APP_NAME:-Cognitif Connexion Foot 2.0}
      APP_ENV: ${APP_ENV:-staging}
      DEBUG: ${DEBUG:-false}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${BACKEND_DATABASE_URL}
      DB_ECHO: ${DB_ECHO:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-cognitif-connexion-foot-v2}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-cognitif-connexion-foot-api}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 256m
    networks:
      - appnet
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GHCR_OWNER:-imrane-ait-dahmade}/reflexion-foot-frontend:${IMAGE_TAG:-master}
    environment:
      DATABASE_URL: ${FRONTEND_DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      AI_ANALYSIS_ENABLED: ${AI_ANALYSIS_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      FASTAPI_PROXY_TARGET: http://backend:8000
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 50s
    mem_limit: 512m
    networks:
      - appnet
    restart: unless-stopped

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:8080"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Uncomment when HTTPS certs exist:
      # - ./deploy/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 64m
    networks:
      - appnet
    restart: unless-stopped

networks:
  appnet:
    driver: bridge
