# Staging deploy: push to master → test → build → GHCR → SSM → EC2
# No permanent AWS keys (OIDC). No production deploy. Does not touch main.

name: Deploy staging

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  GHCR_OWNER: ${{ github.repository_owner }}
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/reflexion-foot-frontend
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/reflexion-foot-backend

jobs:
  test-frontend:
    name: Test frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test

  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -v

  build-and-push:
    name: Build & push GHCR
    needs: [test-frontend, test-backend]
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        id: meta
        run: echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:master
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:master
          build-args: |
            NEXT_PUBLIC_API_URL=
            FASTAPI_PROXY_TARGET=http://backend:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy via SSM
    needs: [build-and-push]
    runs-on: ubuntu-latest
    # Skip deploy until AWS vars are configured (build/push still runs).
    if: ${{ vars.AWS_ROLE_ARN != '' && vars.EC2_INSTANCE_ID != '' }}
    environment: staging
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-3' }}

      - name: Deploy on EC2 via SSM
        id: ssm
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          OWNER: ${{ env.GHCR_OWNER }}
          COMPOSE_DIR: ${{ vars.COMPOSE_DIR || '/opt/cognitif-connexion' }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Cognitif Connexion Foot staging deploy ${IMAGE_TAG}" \
            --parameters commands='[
              "set -euo pipefail",
              "cd '"${COMPOSE_DIR}"'",
              "export IMAGE_TAG='"${IMAGE_TAG}"'",
              "export GHCR_OWNER='"${OWNER}"'",
              "bash deploy/scripts/deploy-on-ec2.sh"
            ]' \
            --query "Command.CommandId" \
            --output text)
          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" || true
          STATUS=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "Status" \
            --output text)
          echo "SSM status: ${STATUS}"
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output json
          test "${STATUS}" = "Success"

      - name: Failure hint
        if: failure()
        run: |
          echo "Deploy failed. Check SSM output above and EC2 docker compose logs."
          echo "Rollback is attempted by deploy-on-ec2.sh when a previous IMAGE_TAG exists."
